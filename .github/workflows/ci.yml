name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      force_fail:
        description: "Run the intentional failing test"
        type: boolean
        default: false
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_FAIL: ${{ inputs.force_fail && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: flake8 app tests
      - run: pytest -v
  build:
    needs: test
    runs-on: ubuntu 26
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg APP_VERSION=${{ github.sha }} -t apex-ops-api:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: apex-ops-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "0"
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Gate passed (tests, build, scan). Local deploy = scripts/deploy.sh"
